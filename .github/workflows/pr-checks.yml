name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grow_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - name: Compile and run offline regression tests
        shell: bash
        run: |
          for config in \
            tests/tsconfig.json \
            tests/tsconfig.sales-intelligence.json \
            tests/tsconfig.client-activation.json \
            tests/tsconfig.sales-activity.json \
            tests/tsconfig.expenses.json \
            tests/tsconfig.grow-audit.json \
            tests/tsconfig.subscription-cancellation.json \
            tests/tsconfig.affiliate.json \
            tests/tsconfig.grow-payment-status.json; do
            if [[ -f "$config" ]]; then
              npx tsc -p "$config"
            fi
          done
          node --test .test-dist/tests/*.test.js
          if [[ -f tests/calendar-server.test.mjs ]]; then
            node --test tests/calendar-server.test.mjs tests/calendar-disconnect-access.test.mjs tests/calendar-access-gate.test.mjs
          fi
          node --test tests/work-schedule-excel.test.mjs tests/work-schedule-scheduler.test.mjs
          node --test tests/grow-webhook-retry.test.mjs
      - name: Verify atomic Grow processing on disposable Postgres
        env:
          GROW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/grow_qa
        run: |
          psql "$GROW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/grow-atomic-bootstrap.sql
          psql "$GROW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/20260604_grow_meshulam_webhook.sql
          psql "$GROW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260927211222_affiliate_referrals.sql
          psql "$GROW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260930231614_grow_atomic_processing.sql
          psql "$GROW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/grow-atomic.sql
          node --test tests/grow-atomic-concurrency.test.mjs
      - run: npm run build
